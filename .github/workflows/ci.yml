name: ci

on:
  push:
    branches: [ main, feat/**, fix/**, ci/** ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: |
          export PYTHONPATH=.
          pytest -q
